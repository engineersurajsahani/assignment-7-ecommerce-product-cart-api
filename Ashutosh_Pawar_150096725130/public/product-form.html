<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Form</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
  </head>
  <body>
    <h1 id="heading">Add Product</h1>

    <div>
      <label for="name">Name : </label>
      <input type="text" id="name" />
    </div>

    <div>
      <label for="category">Category : </label>
      <input type="text" id="category" />
    </div>

    <div>
      <label for="price">Price : </label>
      <input type="number" id="price" min="1" />
    </div>

    <div>
      <label for="stock">Stock : </label>
      <input type="number" id="stock" min="0" />
    </div>

    <div>
      <label for="rating">Rating (0-5) : </label>
      <input type="number" id="rating" min="0" max="5" step="0.1" />
    </div>

    <br />

    <div>
      <button onclick="handleSubmit()">Save</button>
      <button onclick="location.href = 'index.html'">Back</button>
    </div>

    <script>
      // ?id=<productId> present -> edit mode, otherwise add mode
      const productId = new URLSearchParams(location.search).get("id");

      function loadProduct() {
        callApi(`/products/${productId}`)
          .then(({ response, data }) => {
            if (response.status !== 200) {
              showError(data.message || "could not load product!");
              return;
            }
            const product = data.product;
            document.getElementById("name").value = product.name;
            document.getElementById("category").value = product.category;
            document.getElementById("price").value = product.price;
            document.getElementById("stock").value = product.stock;
            document.getElementById("rating").value = product.rating;
          })
          .catch((error) => {
            console.log(error);
            showError("could not reach the server!");
          });
      }

      function handleSubmit() {
        const body = {
          name: document.getElementById("name").value,
          category: document.getElementById("category").value,
          price: document.getElementById("price").value,
          stock: document.getElementById("stock").value,
        };
        const rating = document.getElementById("rating").value;
        if (rating !== "") body.rating = rating;

        const path = productId ? `/products/${productId}` : "/products";
        const method = productId ? "PUT" : "POST";

        callApi(path, method, body)
          .then(({ response, data }) => {
            console.log(data);
            if (handleUnauthorized(response, data)) return;

            if (response.status === 200 || response.status === 201) {
              showSuccess(productId ? "product updated" : "product added").then(
                () => {
                  location.href = "index.html";
                },
              );
            } else {
              showError(data.message || "Something went wrong!");
            }
          })
          .catch((error) => {
            console.log(error);
            showError("could not reach the server!");
          });
      }

      // admins only -- everyone else is sent back to the shop
      getUser().then((user) => {
        if (!user || user.role !== "admin") {
          Swal.fire({
            icon: "error",
            title: "Oops...",
            text: "this page is for admins only!",
          }).then(() => {
            location.href = "index.html";
          });
          return;
        }
        if (productId) {
          document.getElementById("heading").textContent = "Edit Product";
          loadProduct();
        }
      });
    </script>
  </body>
</html>
